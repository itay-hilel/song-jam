name: Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [ main ]

jobs:
  review-checks:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check for TODO/FIXME comments
      run: |
        echo "Checking for TODO/FIXME comments in changed files..."
        git diff --name-only origin/main...HEAD | grep -E '\.(ts|js|tsx|jsx)$' | xargs grep -n "TODO\|FIXME" || echo "No TODO/FIXME comments found"
    
    - name: Check file size limits
      run: |
        echo "Checking for large files..."
        git diff --name-only origin/main...HEAD | while read file; do
          if [ -f "$file" ]; then
            size=$(wc -c < "$file")
            if [ $size -gt 100000 ]; then
              echo "Warning: $file is larger than 100KB ($size bytes)"
            fi
          fi
        done
    
    - name: Security scan
      run: |
        echo "Running security audit..."
        npm audit --audit-level=moderate || echo "Security audit completed with warnings"
    
    - name: Code complexity check
      run: |
        echo "Checking TypeScript files for complexity..."
        npx tsc --noEmit --strict || echo "TypeScript compilation check completed"

  pr-labeler:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Auto-label PR
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo, number } = context.issue;
          
          // Get changed files
          const files = await github.rest.pulls.listFiles({
            owner,
            repo,
            pull_number: number
          });
          
          const labels = [];
          
          // Check file types and add appropriate labels
          const changedFiles = files.data.map(f => f.filename);
          
          if (changedFiles.some(f => f.includes('test') || f.includes('spec'))) {
            labels.push('tests');
          }
          
          if (changedFiles.some(f => f.includes('README') || f.includes('.md'))) {
            labels.push('documentation');
          }
          
          if (changedFiles.some(f => f.includes('package.json') || f.includes('package-lock.json'))) {
            labels.push('dependencies');
          }
          
          if (changedFiles.some(f => f.includes('src/domain/'))) {
            labels.push('domain');
          }
          
          if (changedFiles.some(f => f.includes('src/application/'))) {
            labels.push('application');
          }
          
          if (changedFiles.some(f => f.includes('src/infrastructure/'))) {
            labels.push('infrastructure');
          }
          
          if (changedFiles.some(f => f.includes('src/strategy/'))) {
            labels.push('strategy');
          }
          
          // Add size label based on number of changed lines
          const additions = files.data.reduce((sum, f) => sum + f.additions, 0);
          const deletions = files.data.reduce((sum, f) => sum + f.deletions, 0);
          const totalChanges = additions + deletions;
          
          if (totalChanges < 10) {
            labels.push('size/XS');
          } else if (totalChanges < 50) {
            labels.push('size/S');
          } else if (totalChanges < 200) {
            labels.push('size/M');
          } else if (totalChanges < 500) {
            labels.push('size/L');
          } else {
            labels.push('size/XL');
          }
          
          // Apply labels
          if (labels.length > 0) {
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: number,
              labels
            });
          }

  notify-reviewers:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' && github.event.pull_request.draft == false
    
    steps:
    - name: Request review
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo, number } = context.issue;
          
          // Auto-assign reviewers based on changed files
          const files = await github.rest.pulls.listFiles({
            owner,
            repo,
            pull_number: number
          });
          
          const changedFiles = files.data.map(f => f.filename);
          const reviewers = [];
          
          // Add logic to assign reviewers based on file patterns
          // For now, this is a placeholder - you can customize based on your team
          
          console.log(`PR #${number} is ready for review`);
          console.log(`Changed files: ${changedFiles.join(', ')}`);
          
          // Add a comment to the PR
          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number: number,
            body: `🎵 **Song Jam Code Review** 🎵

This PR is ready for review! 

**Changed areas:**
${changedFiles.map(f => `- \`${f}\``).join('\n')}

**Review checklist:**
- [ ] Code follows architectural patterns
- [ ] Business logic is properly separated
- [ ] Error handling is comprehensive
- [ ] Tests cover new functionality
- [ ] Documentation is updated

*Auto-generated by GitHub Actions*`
          });
